# Windows coverage for kanopi/wp-core-installer (#22).
#
# Linux CI (all PHP versions, lint, static analysis) runs on CircleCI; this
# workflow only adds a Windows runner so path handling (drive letters,
# backslashes) is exercised by the real unit and integration suites.
name: Windows

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests (PHPUnit)
        run: composer test:unit

      - name: Install bats-core
        run: npm install -g bats@1.11.0

      - name: Integration tests (bats)
        run: bats --print-output-on-failure --timing tests/integration/
