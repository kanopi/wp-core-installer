version: 2.1

orbs:
  win: circleci/windows@5.0

# CI for kanopi/wp-core-installer.
#
# quality:   coding standards (PHPCS, PSR-12) and static analysis (PHPStan).
# test:      PHPUnit unit tests plus the bats integration suite, on every
#            supported PHP version (composer.json requires php >=8.0).
#
# The integration suite drives the real composer binary against fixture path
# packages; it installs composer/installers from this repo's vendor/ as an
# offline path repository, so `composer install` must run first.
#
# test-windows: the same unit + integration suites on Windows (Git Bash), so
#               drive letters and backslash paths are exercised (#22).

executors:
  php:
    parameters:
      php-version:
        type: string
        default: "8.3"
    docker:
      - image: cimg/php:<< parameters.php-version >>

commands:
  install-deps:
    steps:
      - run:
          name: Versions
          command: |
            php --version
            composer --version
      - run:
          name: Install dev dependencies
          command: composer install --no-interaction --no-progress

jobs:
  quality:
    executor: php
    steps:
      - checkout
      - run:
          name: Validate composer.json
          command: composer validate --strict
      - install-deps
      - run:
          name: Coding standards (PHPCS)
          command: composer lint
      - run:
          name: Static analysis (PHPStan)
          command: composer analyse

  test:
    parameters:
      php-version:
        type: string
    executor:
      name: php
      php-version: << parameters.php-version >>
    steps:
      - checkout
      - install-deps
      - run:
          name: Unit tests (PHPUnit)
          command: composer test:unit
      - run:
          name: Install bats-core
          command: |
            git clone --depth 1 --branch v1.11.0 \
              https://github.com/bats-core/bats-core.git /tmp/bats-core
            sudo /tmp/bats-core/install.sh /usr/local
            bats --version
      - run:
          name: Integration tests (bats)
          command: bats --print-output-on-failure --timing tests/integration/

  test-windows:
    executor:
      name: win/default
      shell: bash.exe
    environment:
      PHP_VERSION: "8.3"
    steps:
      - checkout
      - run:
          name: Install PHP and Composer
          command: |
            mkdir -p /c/tools/php /c/tools/bin
            curl -fsSL -o /c/tools/php.zip \
              "https://windows.php.net/downloads/releases/latest/php-${PHP_VERSION}-nts-Win32-vs16-x64-latest.zip"
            powershell -NoProfile -Command "Expand-Archive -Force C:/tools/php.zip C:/tools/php"
            cp /c/tools/php/php.ini-development /c/tools/php/php.ini
            {
              echo 'extension_dir = "ext"'
              for ext in curl fileinfo mbstring openssl zip; do echo "extension=${ext}"; done
            } >> /c/tools/php/php.ini
            # /usr/bin (Git Bash's GNU tools) must come before System32, or
            # bats picks up Windows sort.exe / find.exe.
            echo 'export PATH="/c/tools/php:/c/tools/bin:/usr/bin:$PATH"' >> "$BASH_ENV"
            export PATH="/c/tools/php:/c/tools/bin:/usr/bin:$PATH"
            curl -fsSL -o /c/tools/composer.phar https://getcomposer.org/download/latest-stable/composer.phar
            printf '#!/usr/bin/env bash\nexec php "C:/tools/composer.phar" "$@"\n' > /c/tools/bin/composer
            chmod +x /c/tools/bin/composer
            php --version
            composer --version
      - run:
          name: Install dev dependencies
          command: composer install --no-interaction --no-progress
      - run:
          name: Unit tests (PHPUnit)
          command: composer test:unit
      - run:
          name: Install bats-core
          command: |
            git -c advice.detachedHead=false clone -q --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /c/tools/bats-core
            # A wrapper, not a symlink: Git Bash's ln -s copies the file, and a
            # copied bats looks for its libexec/ relative to the copy.
            printf '#!/usr/bin/env bash\nexec /c/tools/bats-core/bin/bats "$@"\n' > /c/tools/bin/bats
            chmod +x /c/tools/bin/bats
            bats --version
      - run:
          name: Integration tests (bats)
          command: bats --print-output-on-failure --timing tests/integration/

workflows:
  ci:
    jobs:
      - quality
      - test-windows
      - test:
          matrix:
            parameters:
              php-version: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
